version: '3.8'

services:
  openpacks-free:
    image: praveenkay/openpacks:free
    container_name: openpacks-free
    restart: unless-stopped
    ports:
      - "${OPENPACKS_PORT:-8080}:80"
    environment:
      - TIER=free
      - DOMAIN=${OPENPACKS_DOMAIN:-localhost}
    volumes:
      - openpacks-free-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  openpacks-free-data: