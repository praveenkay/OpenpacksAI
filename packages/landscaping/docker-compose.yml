version: '3.8'
services:
  landscaping-app:
    image: openpacks/landscaping:${VERSION:-1.0.0}
    container_name: openpacks-landscaping
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3002}:80"
    environment:
      - TIER=${TIER:-free}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-landscaping}
      - DB_USER=${DB_USER:-openpacks}
      - DB_PASS=${DB_PASS:-openpacks}
      - APP_URL=${APP_URL:-http://localhost:3002}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - landscaping-data:/var/www/data
  db:
    image: postgres:16-alpine
    container_name: openpacks-landscaping-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-landscaping}
      - POSTGRES_USER=${DB_USER:-openpacks}
      - POSTGRES_PASSWORD=${DB_PASS:-openpacks}
    volumes:
      - landscaping-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "openpacks"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  landscaping-data:
  landscaping-db:
