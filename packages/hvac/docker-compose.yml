version: '3.8'
services:
  hvac-app:
    image: openpacks/hvac:${VERSION:-1.0.0}
    container_name: openpacks-hvac
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:80"
    environment:
      - TIER=${TIER:-free}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-hvac}
      - DB_USER=${DB_USER:-openpacks}
      - DB_PASS=${DB_PASS:-openpacks}
      - APP_URL=${APP_URL:-http://localhost:3001}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - hvac-data:/var/www/data
  db:
    image: postgres:16-alpine
    container_name: openpacks-hvac-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-hvac}
      - POSTGRES_USER=${DB_USER:-openpacks}
      - POSTGRES_PASSWORD=${DB_PASS:-openpacks}
    volumes:
      - hvac-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "openpacks"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  hvac-data:
  hvac-db:
