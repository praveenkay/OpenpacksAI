version: '3.8'
services:
  vendors-app:
    image: openpacks/vendors:${VERSION:-1.0.0}
    container_name: openpacks-vendors
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3004}:80"
    environment:
      - TIER=${TIER:-free}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-vendors}
      - DB_USER=${DB_USER:-openpacks}
      - DB_PASS=${DB_PASS:-openpacks}
      - APP_URL=${APP_URL:-http://localhost:3004}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - vendors-data:/var/www/data
  db:
    image: postgres:16-alpine
    container_name: openpacks-vendors-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-vendors}
      - POSTGRES_USER=${DB_USER:-openpacks}
      - POSTGRES_PASSWORD=${DB_PASS:-openpacks}
    volumes:
      - vendors-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "openpacks"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  vendors-data:
  vendors-db:
