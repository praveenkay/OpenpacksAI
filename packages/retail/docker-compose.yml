version: '3.8'
services:
  retail-app:
    image: openpacks/retail:${VERSION:-1.0.0}
    container_name: openpacks-retail
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3005}:80"
    environment:
      - TIER=${TIER:-free}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-retail}
      - DB_USER=${DB_USER:-openpacks}
      - DB_PASS=${DB_PASS:-openpacks}
      - APP_URL=${APP_URL:-http://localhost:3005}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - retail-data:/var/www/data
  db:
    image: postgres:16-alpine
    container_name: openpacks-retail-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-retail}
      - POSTGRES_USER=${DB_USER:-openpacks}
      - POSTGRES_PASSWORD=${DB_PASS:-openpacks}
    volumes:
      - retail-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "openpacks"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  retail-data:
  retail-db:
