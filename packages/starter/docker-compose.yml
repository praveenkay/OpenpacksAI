version: '3.8'

services:
  openpacks-starter:
    image: praveenkay/openpacks:starter
    container_name: openpacks-starter
    restart: unless-stopped
    ports:
      - "${OPENPACKS_PORT:-8080}:80"
    environment:
      - TIER=starter
      - VERTICAL=${OPENPACKS_VERTICAL:-smb}
      - DOMAIN=${OPENPACKS_DOMAIN:-localhost}
    volumes:
      - openpacks-starter-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  openpacks-starter-data:
